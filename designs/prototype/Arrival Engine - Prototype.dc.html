<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap">
<style>
  body { margin: 0; background: #E7DECC; }
  a { color: #7B5732; }
  a:hover { color: #26241d; }
</style>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#2b3a26"/>
  <text x="50" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#B89257">AE</text>
  <text x="50" y="70" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="6" letter-spacing="1.4" fill="#F1EADB">ARRIVAL ENGINE</text>
</svg>
</template>
</helmet>

<div style="min-height: 100vh; display: grid; grid-template-columns: 300px 1fr; align-items: start; font-family: 'Inter', sans-serif; color: #26241d;">

  <aside style="position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 40px 28px; background: #F1EADB; border-right: 1px solid rgba(123,87,50,0.34); box-sizing: border-box;">
    <p style="font-size: 11px; font-weight: 500; letter-spacing: 3.5px; text-transform: uppercase; color: #7B5732; margin: 0 0 10px;">Arena Hall · staff</p>
    <h1 style="font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 38px; line-height: 1.04; margin: 0 0 24px;">The arrival engine</h1>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div style="margin-bottom: 24px;">
        <p style="font-size: 10px; font-weight: 500; letter-spacing: 2.4px; text-transform: uppercase; color: #7B5732; margin: 0 0 8px; padding-bottom: 9px; border-bottom: 1px solid rgba(123,87,50,0.22);">{{ g.title }}</p>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="5">
          <button type="button" onClick="{{ it.go }}" style="{{ it.style }}" style-hover="background: #E7DECC;">
            <span style="font-size: 14px;">{{ it.label }}</span>
            <span style="font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: #7B5732;">{{ it.tag }}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>

    <p style="font-size: 11.5px; line-height: 1.7; color: #6f685a; margin: 26px 0 0; padding-top: 16px; border-top: 1px solid rgba(123,87,50,0.22);">Each frame loads the real <span style="color:#26241d">arena.css</span> and the markup the
      <span style="color:#26241d">handback/templates</span> emit, so the design doc and the drop-in
      repo files cannot drift. For the editable version see
      <a href="Arrival Engine - Screens.dc.html" style="text-decoration: none; border-bottom: 1px solid rgba(184,146,87,0.9);">Screens</a>.</p>
  </aside>

  <main style="padding: 48px; display: flex; justify-content: center;">
    <div>
      <div style="display: flex; align-items: baseline; gap: 12px; width: 390px; margin-bottom: 10px;">
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 2.4px; text-transform: uppercase; color: #26241d;">{{ current.label }}</span>
        <span style="flex: 1; height: 1px; background: rgba(123,87,50,0.28);"></span>
        <span style="font-size: 10px; letter-spacing: 1.6px; color: #6f685a;">390×844</span>
      </div>

      <iframe id="phone" src="{{ src }}" onLoad="{{ onFrameLoad }}" title="{{ current.label }}" style="width: 390px; height: 844px; border: 1px solid rgba(123,87,50,0.34); background: #F1EADB; display: block;"></iframe>

      <div style="display: flex; align-items: center; gap: 22px; width: 390px; padding: 11px 0 0; border-top: 1px solid rgba(123,87,50,0.28);">
        <button type="button" onClick="{{ back }}" style="background: transparent; border: 0; padding: 0; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 1.6px; text-transform: uppercase; color: #7B5732; cursor: pointer;" style-hover="color: #26241d;">Back</button>
        <button type="button" onClick="{{ reload }}" style="background: transparent; border: 0; padding: 0; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 1.6px; text-transform: uppercase; color: #7B5732; cursor: pointer;" style-hover="color: #26241d;">Reload</button>
        <span style="flex: 1;"></span>
        <button type="button" onClick="{{ toRoom }}" style="background: transparent; border: 0; padding: 0; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 1.6px; text-transform: uppercase; color: #7B5732; border-bottom: 1px solid rgba(184,146,87,0.9); cursor: pointer;" style-hover="color: #26241d;">Back to Room</button>
      </div>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:1000}}">
const S = [
  { file: 'handback/render/room.html', label: 'Room', tag: 'surface', group: 'The three surfaces' },
  { file: 'handback/render/ready.html', label: 'Card — ready', tag: 'primary', group: 'The three surfaces' },
  { file: 'handback/render/why.html', label: 'Why this score', tag: 'one tap', group: 'The three surfaces' },

  { file: 'handback/render/unknown-coverage.html', label: 'Unknown coverage', tag: 'the defect', group: 'Card — coverage and match' },
  { file: 'handback/render/cold-trail.html', label: 'Cold trail', tag: 'quiet', group: 'Card — coverage and match' },
  { file: 'handback/render/no-strong-match.html', label: 'No strong match', tag: 'a miss', group: 'Card — coverage and match' },
  { file: 'handback/render/empty-room.html', label: 'Empty room', tag: 'not an error', group: 'Card — coverage and match' },

  { file: 'handback/render/withheld.html', label: 'Withheld', tag: 'hard gate', group: 'Card — degraded' },
  { file: 'handback/render/ambiguous.html', label: 'Ambiguous', tag: 'host picks', group: 'Card — degraded' },

  { file: 'handback/render/ingesting.html', label: 'Ingesting', tag: 'live re-run', group: 'Operations' },
  { file: 'handback/render/scoring.html', label: 'How the score works', tag: 'reference', group: 'Operations' },
  { file: 'handback/render/room-empty.html', label: 'Room — empty', tag: 'store-empty', group: 'Operations' },
];

// The surfaces are plain files the browser may cache, which means an edited surface can keep
// serving its old self in the preview. Every frame load carries a build stamp so it cannot.
const BUILD = Date.now();

class Component extends DCLogic {
  state = { src: S[0].file, stack: [], visited: [S[0].file] };

  get frame() { return document.getElementById('phone'); }

  navigate = (file) => {
    if (file === this.state.src) return;
    this.setState((s) => ({
      src: file,
      stack: [...s.stack, s.src],
      visited: s.visited.includes(file) ? s.visited : [...s.visited, file],
    }));
  };

  onFrameLoad = () => {
    // The links inside the phone are live; keep the rail in step with wherever they land.
    try {
      const path = this.frame && this.frame.contentWindow.location.pathname;
      if (!path) return;
      const hit = S.find((s) => path.endsWith(s.file.split('/').pop()));
      if (hit && hit.file !== this.state.src) {
        this.setState((s) => ({
          src: hit.file,
          stack: [...s.stack, s.src],
          visited: s.visited.includes(hit.file) ? s.visited : [...s.visited, hit.file],
        }));
      }
    } catch (e) { /* same origin here, but never break the frame over it */ }
  };

  renderVals() {
    const cur = S.find((s) => s.file === this.state.src) || S[0];
    const titles = [];
    S.forEach((s) => { if (!titles.includes(s.group)) titles.push(s.group); });

    const rowStyle = (s) => {
      const on = s.file === this.state.src;
      const seen = this.state.visited.includes(s.file);
      return {
        display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
        gap: '12px', width: '100%', textAlign: 'left', cursor: 'pointer',
        fontFamily: 'Inter, sans-serif', letterSpacing: '0.01em',
        padding: '9px 10px 9px 12px', border: 0,
        borderLeft: '2px solid ' + (on ? '#B89257' : 'transparent'),
        background: on ? '#E7DECC' : 'transparent',
        color: on ? '#26241d' : seen ? '#403c32' : '#6f685a',
      };
    };

    return {
      src: this.state.src + '?b=' + BUILD,
      current: cur,
      onFrameLoad: this.onFrameLoad,
      toRoom: () => this.navigate(S[0].file),
      reload: () => { if (this.frame) this.frame.src = this.state.src + '?b=' + Date.now(); },
      back: () => this.setState((s) => (s.stack.length
        ? { src: s.stack[s.stack.length - 1], stack: s.stack.slice(0, -1) }
        : {})),
      groups: titles.map((title) => ({
        title,
        items: S.filter((s) => s.group === title).map((s) => ({
          label: s.label, tag: s.tag, style: rowStyle(s), go: () => this.navigate(s.file),
        })),
      })),
    };
  }
}

</script>
</body>
</html>
